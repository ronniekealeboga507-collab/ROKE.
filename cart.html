<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart – ROKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <a href="index.html" class="header-logo">ROKE</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="about us.html">About Us</a>
                <a href="cart.html" class="cart-link">🛒<span class="cart-count" style="display:none">0</span></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="cart-page">
            <div class="cart-title-block">
                <h1>Your Cart</h1>
                <p class="cart-subtitle">Review your selected items</p>
            </div>

            <!-- Empty state -->
            <div class="empty-cart" id="empty-cart" style="display:none;">
                <p>YOUR CART IS EMPTY</p>
                <a href="categories.html" class="btn-shop">CONTINUE SHOPPING</a>
            </div>

            <!-- Cart layout -->
            <div class="cart-layout" id="cart-layout">
                <div class="cart-items" id="cart-items"></div>

                <aside class="cart-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">BWP 0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="summary-total">BWP 0.00</span>
                    </div>
                    <button class="checkout-btn" onclick="alert('Checkout coming soon!')">PROCEED TO CHECKOUT</button>
                    <a href="categories.html" class="continue-link">← Continue Shopping</a>
                </aside>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ROKE. All rights reserved</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('rokeCart')) || [];

        function saveCart() {
            localStorage.setItem('rokeCart', JSON.stringify(cart));
        }

        function fmt(n) {
            return 'BWP ' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function render() {
            const itemsEl  = document.getElementById('cart-items');
            const emptyEl  = document.getElementById('empty-cart');
            const layoutEl = document.getElementById('cart-layout');

            if (cart.length === 0) {
                emptyEl.style.display  = 'flex';
                layoutEl.style.display = 'none';
                return;
            }

            emptyEl.style.display  = 'none';
            layoutEl.style.display = 'grid';

            itemsEl.innerHTML = cart.map((item, i) => `
                <div class="cart-row">
                    <div>
                        <p class="cart-row-name">${item.name}</p>
                        <p class="cart-row-price">${fmt(item.price)} each</p>
                    </div>
                    <div class="cart-row-controls">
                        <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
                        <span class="qty-display">${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                    </div>
                    <div class="cart-row-total">${fmt(item.price * item.qty)}</div>
                    <button class="remove-btn" onclick="removeItem(${i})" title="Remove">✕</button>
                </div>
            `).join('');

            const subtotal = cart.reduce((s, item) => s + item.price * item.qty, 0);
            document.getElementById('summary-subtotal').textContent = fmt(subtotal);
            document.getElementById('summary-total').textContent    = fmt(subtotal);

            // Update badge
            const total = cart.reduce((s, item) => s + item.qty, 0);
            document.querySelectorAll('.cart-count').forEach(b => {
                b.textContent = total;
                b.style.display = total > 0 ? 'flex' : 'none';
            });
        }

        function changeQty(i, delta) {
            cart[i].qty += delta;
            if (cart[i].qty <= 0) cart.splice(i, 1);
            saveCart();
            render();
        }

        function removeItem(i) {
            cart.splice(i, 1);
            saveCart();
            render();
        }

        render();
    </script>
</body>
</html>
